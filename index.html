<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Teatro de Sombras</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 32px;
        background: #000505;
        color: #e1e1e6;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        user-select: none;
        -webkit-font-smoothing: antialiased;
        }

        #cena {
        font-size: 3.5rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-align: center;
        color: #00ffff;
        text-shadow: 
            0 0 4px rgba(0, 255, 255, 0.6),
            0 0 12px rgba(0, 255, 255, 0.4),
            0 0 30px rgba(0, 255, 255, 0.2);
        }

        .bt {
        display: flex;
        gap: 16px;
        }

        button {
        font-size: 2rem;
        padding: 16px 36px;
        border: 1px solid rgba(0, 255, 255, 0.2);
        border-radius: 16px;
        background: rgba(0, 255, 255, 0.03);
        color: #00ffff;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
        }

        button:hover {
        background: #00ffff;
        color: rgb(0, 41, 41);
        box-shadow: 
            0 0 8px rgba(0, 255, 255, 0.6),
            0 0 20px rgba(0, 255, 255, 0.4);
        transform: translateY(-2px);
        }

        button:active {
        transform: scale(0.96) translateY(0);
        box-shadow: 0 0 4px rgba(0, 255, 255, 0.4);
        }

        #dica {
        font-size: 0.9rem;
        color: #00ffff;
        letter-spacing: 0.03em;
        background: rgba(0, 255, 255, 0.03);
        padding: 8px 16px;
        border-radius: 20px;
        border: 1px solid rgba(0, 255, 255, 0.08);
        }

        #dica a {
            color: #deffff;
            text-decoration: none;
        }
    </style>
  </head>
  
  <body>
    <div id="cena">Pronto</div>
    <div class="bt">
      <button id="ant">◀</button>
      <button id="stop">■</button>
      <button id="prox">▶</button>
    </div>
    <div id="dica">Use as setas ou o espaço para navegar · Esc para reiniciar · Site feito por <a href="https://claude.ai" target="_blank">Claudio</a></div>

    <script>
    const cenas = [
      {nome: "Cena 1 (Floresta Calma)",  src: "c1.mp3"},
      {nome: "Cena 2 (Floresta Tensa)",  src: "c2.mp3"},
      {nome: "Cena 3A (Fogueira)", src: "c3a.mp3"},
      {nome: "Cena 3B  (Floresta Tensa)", src: "c2.mp3"},
      {nome: "Cena 4 (Perseguição)",  src: "c4.mp3"},
      {nome: "Cena 5 (Canoa)",  src: "c5.mp3"},
    ];

    const cache = {};
    let atual = -1, audio = null;
    const el = document.getElementById("cena");

    function parar() {
      if (audio) { audio.pause(); audio.currentTime = 0; audio = null; }
    }

    function ir(i) {
      if (i < 0 || i >= cenas.length) return;
      parar();
      atual = i;
      const src = cenas[i].src;
      audio = cache[src] || (cache[src] = new Audio(src));
      audio.loop = true;
      audio.currentTime = 0;
      audio.play().catch(e => console.error(e));
      el.textContent = cenas[i].nome;
    }

    function pararTudo() { parar(); atual = -1; el.textContent = "Pronto"; }

    document.getElementById("prox").onclick = () => ir(atual + 1);
    document.getElementById("ant").onclick = () => ir(atual - 1);
    document.getElementById("stop").onclick = pararTudo;

    document.addEventListener("keydown", e => {
      if (e.code === "Space" || e.code === "ArrowRight") { e.preventDefault(); ir(atual + 1); }
      else if (e.code === "ArrowLeft") ir(atual - 1);
      else if (e.code === "Escape") pararTudo();
    });
    </script>
  </body>
</html>
